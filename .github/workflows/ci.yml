name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qida_growth
          POSTGRES_USER: qida
          POSTGRES_PASSWORD: qida_local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qida -d qida_growth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://qida:qida_local@localhost:5432/qida_growth?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm db:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build GitHub Pages mode
        run: pnpm --filter @qida/web build
        env:
          VITE_STATIC_DEMO: "true"
          VITE_BASE_PATH: /qida-growth-intelligence/

