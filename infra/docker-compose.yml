services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qida_growth
      POSTGRES_USER: qida
      POSTGRES_PASSWORD: qida_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qida -d qida_growth"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - qida-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://qida:qida_local@postgres:5432/qida_growth?schema=public
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173
      SEED_VERSION: qida-synthetic-v2
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm db:migrate && pnpm exec tsx prisma/seed/startup.ts && pnpm --filter @qida/api dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    ports:
      - "3000:3000"

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "5173:5173"

volumes:
  qida-postgres:

