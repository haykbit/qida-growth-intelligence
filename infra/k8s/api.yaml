apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: qida-growth
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      initContainers:
        - name: migrate-and-seed
          image: qida-api
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "pnpm db:migrate && pnpm exec tsx prisma/seed/startup.ts"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres, key: DATABASE_URL } }
      containers:
        - name: api
          image: qida-api
          imagePullPolicy: IfNotPresent
          command: ["pnpm", "--filter", "@qida/api", "dev"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres, key: DATABASE_URL } }
            - { name: PORT, value: "3000" }
            - { name: CORS_ORIGIN, value: "http://localhost:5173" }
            - { name: SEED_VERSION, value: "qida-synthetic-v2" }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: qida-growth
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 3000, targetPort: http }

