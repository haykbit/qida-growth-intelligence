apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: qida-growth
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: qida-web
          imagePullPolicy: IfNotPresent
          command: ["pnpm", "--filter", "@qida/web", "dev", "--host", "0.0.0.0"]
          env:
            - { name: VITE_API_URL, value: "http://localhost:3000/api/v1" }
          ports:
            - { name: http, containerPort: 5173 }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: qida-growth
spec:
  selector: { app: web }
  ports:
    - { name: http, port: 5173, targetPort: http }

